# Alembic 迁移配置 — Voice Platform
# 数据库 URL 从 voice_platform.config.Settings 读取，此处仅为占位。
# Usage:
#   alembic -c infra/docker/alembic.ini upgrade head
#   alembic -c infra/docker/alembic.ini revision --autogenerate -m "description"

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/../..

# 用文件名的日期+序列号前缀，对齐现有 001_xxx.sql 风格
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

sqlalchemy.url = placeholder  # env.py 从 Settings 动态注入

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
