# Production deployment — PostgreSQL + Redis + API + Workers
# Usage:
#   1. Copy .env.example .env and fill in production secrets
#   2. docker compose -f infra/docker/docker-compose.dev.yml -f infra/docker/docker-compose.prod.yml up -d
#
# Prerequisites:
#   docker compose -f infra/docker/docker-compose.dev.yml up -d   # start PG + Redis first
#   docker build -t voice-platform:latest -f infra/docker/Dockerfile.platform .

services:
  api:
    image: ${PLATFORM_IMAGE:-voice-platform:latest}
    container_name: gpt-platform-api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://voice:voice_dev@postgres:5432/voice_platform}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PLATFORM_RELEASE_VERSION=${PLATFORM_RELEASE_VERSION:-latest}
      - LOG_JSON=true
    ports:
      - "${API_PORT:-8001}:8001"
      - "${METRICS_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: >
      uvicorn apps.api.main:app
      --host 0.0.0.0
      --port 8001
      --workers ${API_WORKERS:-4}
      --log-level info
    volumes:
      - platform_data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M

  infer-worker:
    image: ${PLATFORM_IMAGE:-voice-platform:latest}
    container_name: gpt-platform-infer
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://voice:voice_dev@postgres:5432/voice_platform}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PLATFORM_RELEASE_VERSION=${PLATFORM_RELEASE_VERSION:-latest}
      - LOG_JSON=true
      - WORKER_HEALTH_PORT=8081
      - METRICS_PORT=9091
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m workers.infer.runner
    volumes:
      - platform_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  train-worker:
    image: ${PLATFORM_IMAGE:-voice-platform:latest}
    container_name: gpt-platform-train
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://voice:voice_dev@postgres:5432/voice_platform}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PLATFORM_RELEASE_VERSION=${PLATFORM_RELEASE_VERSION:-latest}
      - LOG_JSON=true
      - WORKER_HEALTH_PORT=8082
      - METRICS_PORT=9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m workers.train.runner
    volumes:
      - platform_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  batch-worker:
    image: ${PLATFORM_IMAGE:-voice-platform:latest}
    container_name: gpt-platform-batch
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://voice:voice_dev@postgres:5432/voice_platform}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PLATFORM_RELEASE_VERSION=${PLATFORM_RELEASE_VERSION:-latest}
      - LOG_JSON=true
      - WORKER_HEALTH_PORT=8083
      - METRICS_PORT=9093
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m workers.batch.runner
    volumes:
      - platform_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  platform_data:
